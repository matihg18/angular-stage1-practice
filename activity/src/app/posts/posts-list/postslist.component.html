<h1 [class]="'text-[20px]'">List of Posts</h1>
@if (store.vm$ | async; as vm) {
  <ul [class]="'list-none'">
      @for (post of vm.posts; track post){
        <li>
          <post-component-dumb [post]="post"></post-component-dumb>
        </li>
      } @empty {
        <p>There are no items.</p>
      }
  </ul>
  <button matButton [routerLink]="['..','create']">Make a post</button>
}
