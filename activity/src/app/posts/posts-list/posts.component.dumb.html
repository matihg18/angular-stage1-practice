@if (store.vm$ | async; as vm) {
  @if (vm.post; as post) {
    <mat-card appearance="outlined" [class]="'w-[250px] min-h-[150px] h-auto m-[10px]'">
      <mat-card-header>
        <mat-card-title [class]="'text-[22px] mt-[10px] mb-0 text-[#1f2124]'">{{post.user}}</mat-card-title>
        <mat-card-subtitle [class]="'m-0'">{{post.published | date: 'shortDate'}}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="text-[13px]"
        [style.display]="vm.hidden ? '-webkit-box' : null"
        [style.-webkit-box-orient]="vm.hidden ? 'vertical' : null"
        [style.-webkit-line-clamp]="vm.hidden ? '2' : null"
        [style.overflow]="vm.hidden ? 'hidden' : null">
          {{post.content}}
        </mat-card-content>
      <mat-card-actions>
        <button matButton [class]="'bg-transparent text-[#00ff] border-0 font-medium m-0 p-0'" (click)="store.changeHidden()">{{vm.hidden ? 'VIEW MORE' : 'VIEW LESS'}}</button>
        <button matButton [class]="'bg-transparent text-[#00ff] border-0 font-medium m-0 p-0'" [routerLink]="['..','edit',post.id]">UPDATE POST</button>
      </mat-card-actions>
    </mat-card>
  }
}
